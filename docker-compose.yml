# TabbySync: als Stack in Dockhand einfügen.
# OWNER durch den GitHub-Benutzernamen/Organisation ersetzen (klein geschrieben).
services:
  tabbysync:
    image: ghcr.io/OWNER/tabby-sync:latest
    container_name: tabbysync
    restart: unless-stopped
    ports:
      - "${TABBYSYNC_PORT:-8080}:8080"
    environment:
      - MAX_PROFILE_DELETES=${MAX_PROFILE_DELETES:-5}
    volumes:
      - tabbysync-data:/data

volumes:
  tabbysync-data:
