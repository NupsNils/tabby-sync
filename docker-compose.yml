# TabbySync: paste into Dockhand as a stack.
services:
  tabbysync:
    image: ghcr.io/nupsnils/tabby-sync:latest
    container_name: tabbysync
    restart: unless-stopped
    ports:
      # Only reachable from this host (the reverse proxy must run here or share a Docker network).
      - "127.0.0.1:${TABBYSYNC_PORT:-8080}:8080"
    environment:
      - MAX_PROFILE_DELETES=${MAX_PROFILE_DELETES:-5}
      - MAX_DELETE_PERCENT=${MAX_DELETE_PERCENT:-50}
    volumes:
      - tabbysync-data:/data
    # To join Nginx Proxy Manager's Docker network: in the 2 lines below and the
    # 4 "networks" lines at the end of the file, remove only the leading "# ".
#     networks:
#       - npm

volumes:
  tabbysync-data:

# networks:
#   npm:
#     external: true
#     name: nginx-proxy-manager_default   # NPM's network name, see `docker network ls`
